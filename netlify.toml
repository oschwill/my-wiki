[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
from = "/test-api"
to = "https://my-wiki-3azw.onrender.com/api/v1/content/getLanguages"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "https://my-wiki-3azw.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/auth/google"
to = "https://my-wiki-3azw.onrender.com/auth/google"
status = 200
force = true

[[redirects]]
from = "/auth/github"
to = "https://my-wiki-3azw.onrender.com/auth/github"
status = 200
force = true

# React Router – alle übrigen Frontend-Routen
[[redirects]]
from = "/*"
to = "/index.html"
status = 200